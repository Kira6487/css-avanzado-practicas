<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/style.css">
    <title>Estructura de un blog</title>
</head>
<body>
    <main class="dashboard">
    <header>
        <img src="images/twice-logo.jpg" alt="Logo del blog" class="logo">
        <nav aria-label="Navegación principal">
            <a href="#inicio">Inicio</a>
            <a href="#articulos">Artículos</a>
            <a href="#contacto">Contacto</a>
        </nav>
    </header>
    <section class="main-content" id="articulos">
        <h2>Artículos</h2>
        <p>Esta es la zona principal para los artículos del blog.</p>
    </section>
    <aside class="sidebar">
        <h2>Enlaces y publicidad</h2>
        <p>Contenido adicional para la barra lateral.</p>
        <img src="images/twice-aside.jpg" alt="Publicidad" class="ad-image">
    </aside>
    <footer>
        <p>&copy; 2024 Mi blog. Todos los derechos reservados.</p>
    </footer>
    </main>
</body>
</html>
